Foreground yes
DatabaseOwner clamav
DatabaseDirectory /scan/database
DatabaseMirror https://database.clamav.net
DNSDatabaseInfo current.cvd.clamav.net
Checks 12
ConnectTimeout 10
ReceiveTimeout 30
MaxAttempts 3
TestDatabases yes
NotifyClamd /etc/myfans-clamd.conf
PidFile /scan/freshclam.pid
LogTime yes
LogVerbose no
