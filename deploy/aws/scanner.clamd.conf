Foreground yes
User clamav
DatabaseDirectory /scan/database
TemporaryDirectory /scan/tmp
LocalSocket /scan/clamd.sock
LocalSocketMode 600
TCPSocket 3310
TCPAddr 127.0.0.1
PidFile /scan/clamd.pid
LogTime yes
LogClean no
LogVerbose no
MaxThreads 2
MaxQueue 10
MaxConnectionQueueLength 10
# Match the application's bounded 256 MiB video source contract. Aggregate
# decoded scan bytes remain bounded independently of the streamed input size.
StreamMaxLength 256M
MaxScanSize 512M
MaxFileSize 256M
MaxRecursion 10
MaxFiles 1000
MaxScanTime 25000
ReadTimeout 30
CommandReadTimeout 10
SendBufTimeout 1000
SelfCheck 300
ConcurrentDatabaseReload yes
AlertExceedsMax yes
