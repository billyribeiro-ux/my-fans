[workspace]
members = ["services/api"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"

[workspace.dependencies]
axum = { version = "=0.8.9", features = ["json", "multipart"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "fs", "time", "process"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["trace", "timeout"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
argon2 = { version = "=0.6.0", features = ["getrandom"] }
sha2 = "=0.11.0"
chrono = { version = "=0.4.45", features = ["serde"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
totp-rs = { version = "=6.0.0", features = ["otpauth"] }
aes-gcm = "=0.11.1"
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
url = "=2.5.8"
aws-config = { version = "=1.12.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sqs = { version = "=1.114.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form", "query"] }
hmac = "=0.13.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
