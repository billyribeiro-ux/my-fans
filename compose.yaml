services:
  app:
    profiles: [bundle]
    build:
      context: .
      args:
        APP_ORIGIN: http://127.0.0.1:3000
    ports: ['127.0.0.1:3000:3000']
    environment:
      DATABASE_URL: postgresql://myfans:local-development-only@bundle-postgres:5432/myfans
    volumes: [media_data:/app/.local/media]
    depends_on:
      bundle-postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 150s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  bundle-postgres:
    profiles: [bundle]
    image: postgres:18.6@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
    environment:
      POSTGRES_USER: myfans
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: myfans
    volumes: [bundle_postgres_data:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myfans -d myfans']
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:18.6@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
    environment:
      POSTGRES_USER: myfans
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: myfans
    ports:
      - '127.0.0.1:54328:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myfans -d myfans']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  media_data:
  bundle_postgres_data:
  postgres_data:
